# Synthetic-data parser sandbox preview. Not a family-record deployment.
services:
  parser-worker:
    build:
      context: .
      dockerfile: Dockerfile.parser
    image: adeno-parser:dev
    user: "10002:10003"
    network_mode: none
    read_only: true
    volumes:
      - parser_socket:/run/adeno-parser
    tmpfs:
      - /tmp:size=67108864,mode=1777
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 16
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    environment:
      ADENO_PARSER_SOCKET_PATH: /run/adeno-parser/parser.sock

volumes:
  parser_socket:
