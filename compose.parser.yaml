# Synthetic-data parser sandbox preview. Not a family-record deployment.
services:
  parser-worker:
    build:
      context: .
      dockerfile: Dockerfile.parser
      target: runtime
    image: adeno-parser:dev
    user: "10002:10003"
    network_mode: none
    read_only: true
    volumes:
      - parser_socket:/run/adeno-parser
    tmpfs:
      - /tmp:size=67108864,mode=1777
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 64
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "dist/runParserHealthcheck.js"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    # This retries crash exits only; Docker health status alone does not restart.
    restart: "on-failure:3"
    environment:
      ADENO_PARSER_SOCKET_PATH: /run/adeno-parser/parser.sock
      ADENO_PARSER_HEALTH_SOCKET_PATH: /run/adeno-parser/health.sock

volumes:
  parser_socket:
