services:
  adeno-private:
    container_name: adeno-private
    image: adeno-private:${ADENO_RELEASE_TAG:?Set a reviewed release tag}
    build:
      context: .
      dockerfile: Dockerfile.private-pilot
    init: true
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["127.0.0.1:8091:8080"]
    environment:
      ADENO_PRIVATE_ORIGIN: https://adeno.kunjadia.dev
      ADENO_PRIVATE_AGENT_CONNECTIONS: ${ADENO_PRIVATE_AGENT_CONNECTIONS:-disabled}
    volumes:
      - ${ADENO_PRIVATE_DATA_DIR:?Set an approved private data directory}:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    mem_limit: 768m
    pids_limit: 128
    cpus: 1.0
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
