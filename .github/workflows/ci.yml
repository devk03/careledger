name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.6.16"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: .venv/bin/pytest
      - run: .venv/bin/ruff check app tests
      - run: .venv/bin/mypy app tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test
      - run: npm run build
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag careledger:test .
      - run: docker volume create careledger-test-data
      - run: docker run --detach --name careledger-test --publish 8080:8080 --volume careledger-test-data:/data careledger:test
      - run: curl --fail --retry 20 --retry-delay 1 --retry-connrefused --retry-all-errors http://127.0.0.1:8080/health/ready
