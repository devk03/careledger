name: CI

on:
  workflow_dispatch:
    inputs:
      full_checks:
        description: Run browser end-to-end and Docker checks (uses more Actions minutes)
        required: false
        default: false
        type: boolean

concurrency:
  group: careledger-manual-ci
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
      - run: node --test tools/privacyAudit.test.mjs tools/verifyPublicAssets.test.mjs
      - run: node tools/privacyAudit.mjs
      - run: node tools/verifyPublicAssets.mjs

  backend:
    needs: privacy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.6.16"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: .venv/bin/pytest
      - run: .venv/bin/ruff check app tests
      - run: .venv/bin/mypy app tests

  frontend:
    needs: privacy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test
      - run: npm run build
      - run: npm run lint
      - if: ${{ inputs.full_checks }}
        run: npx playwright install --with-deps chromium
      - if: ${{ inputs.full_checks }}
        run: npm run test:e2e

  typescript-server:
    needs: privacy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  container:
    needs: privacy
    if: ${{ inputs.full_checks }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build --tag careledger:test .
      - run: docker volume create careledger-test-data
      - run: docker run --detach --name careledger-test --publish 8080:8080 --volume careledger-test-data:/data careledger:test
      - run: curl --fail --retry 20 --retry-delay 1 --retry-connrefused --retry-all-errors http://127.0.0.1:8080/health/ready
