DatabaseDirectory /var/lib/adeno-signatures
DatabaseOwner adeno-scanner
DatabaseMirror database.clamav.net
DNSDatabaseInfo current.cvd.clamav.net
MaxAttempts 2
ConnectTimeout 20
ReceiveTimeout 60
TestDatabases yes
Bytecode yes
# Launch freshclam once, never with --daemon. No daemon notification is needed:
# signature updates run while the scanner is stopped and are loaded at startup.
