# Install only after DNS and a valid certificate are ready. No public signup.
server {
    listen 80;
    listen [::]:80;
    server_name adeno.kunjadia.dev;
    access_log off;
    error_log /dev/null crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/adeno-acme;
        try_files $uri =404;
    }
    location / {
        return 308 https://adeno.kunjadia.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name adeno.kunjadia.dev;
    ssl_certificate /etc/letsencrypt/live/adeno.kunjadia.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adeno.kunjadia.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # Do not retain record URLs or request diagnostics in shared web logs.
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 30m;
    client_body_timeout 30s;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        # Keep records out of Nginx request/response temporary files.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
