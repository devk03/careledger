services:
  careledger:
    build:
      context: .
    environment:
      APP_PORT: 8080
      APP_EDITION: ${APP_EDITION:-community}
      AI_CREDENTIAL_MODE: ${AI_CREDENTIAL_MODE:-self_hosted}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      AI_MODEL: ${AI_MODEL:-openai/gpt-5.4-mini}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CUSTOM_AI_API_KEY: ${CUSTOM_AI_API_KEY:-}
      CUSTOM_AI_BASE_URL: ${CUSTOM_AI_BASE_URL:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
    ports:
      - "127.0.0.1:${CARELEDGER_PORT:-8080}:8080"
    volumes:
      - careledger_data:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=268435456,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  careledger_data:
