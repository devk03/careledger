[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "careledger"
version = "0.1.0"
description = "A source-linked family health evidence workspace for adult caregivers"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
  "argon2-cffi==25.1.0",
  "cryptography==50.0.1",
  "fastapi==0.115.12",
  "httpx==0.28.1",
  "openai==3.6.0",
  "pillow==12.3.0",
  "pikepdf==10.12.0",
  "pydantic-settings==2.9.1",
  "python-multipart==0.0.20",
  "uvicorn[standard]==0.34.2",
]

[project.optional-dependencies]
dev = [
  "mypy==1.15.0",
  "pytest==8.3.5",
  "pytest-cov==6.1.1",
  "ruff==0.11.10",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
